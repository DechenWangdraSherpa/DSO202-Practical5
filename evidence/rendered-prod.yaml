apiVersion: v1
kind: Namespace
metadata:
  annotations:
    training.example.com/stage: production
  labels:
    environment: prod
  name: webapp-prod
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <body>
        <h1>PRODUCTION environment</h1>
        <p>webapp running in namespace webapp-prod</p>
      </body>
    </html>
kind: ConfigMap
metadata:
  annotations:
    training.example.com/stage: production
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
    environment: prod
  name: web-content-fbkh4cm8d6
  namespace: webapp-prod
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    training.example.com/stage: production
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
    environment: prod
  name: webapp
  namespace: webapp-prod
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: webapp
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    training.example.com/stage: production
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
    environment: prod
  name: webapp
  namespace: webapp-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
      app.kubernetes.io/name: webapp
      app.kubernetes.io/part-of: dso202-practical-05
  template:
    metadata:
      annotations:
        training.example.com/stage: production
      labels:
        app: webapp
        app.kubernetes.io/name: webapp
        app.kubernetes.io/part-of: dso202-practical-05
        environment: prod
    spec:
      containers:
      - image: nginx:1.28-alpine
        name: nginx
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-fbkh4cm8d6
        name: content
