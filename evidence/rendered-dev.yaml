apiVersion: v1
kind: Namespace
metadata:
  annotations:
    training.example.com/stage: development
  labels:
    environment: dev
  name: webapp-dev
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <body>
        <h1>DEV environment</h1>
        <p>webapp running in namespace webapp-dev</p>
      </body>
    </html>
kind: ConfigMap
metadata:
  annotations:
    training.example.com/stage: development
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
    environment: dev
  name: web-content-h7g9d4628t
  namespace: webapp-dev
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    training.example.com/stage: development
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
    environment: dev
  name: webapp
  namespace: webapp-dev
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: webapp
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    training.example.com/stage: development
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
    environment: dev
  name: webapp
  namespace: webapp-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
      app.kubernetes.io/name: webapp
      app.kubernetes.io/part-of: dso202-practical-05
  template:
    metadata:
      annotations:
        training.example.com/stage: development
      labels:
        app: webapp
        app.kubernetes.io/name: webapp
        app.kubernetes.io/part-of: dso202-practical-05
        environment: dev
    spec:
      containers:
      - image: nginx:1.27-alpine
        name: nginx
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-h7g9d4628t
        name: content
