apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-dev

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      environment: dev
    includeTemplates: true

replicas:
  - name: webapp
    count: 1

# Replace the base page with the dev page (same generator name => merge).
configMapGenerator:
  - name: web-content
    behavior: replace
    files:
      - index.html

commonAnnotations:
  training.example.com/stage: development
